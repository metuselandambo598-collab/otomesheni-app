name: Unda APK ya Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Vuta Kodi
      uses: actions/checkout@v4

    - name: Weka Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Weka Zana za Buildozer na Java
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Unda APK
      run: |
        buildozer -v android debug

    - name: Hifadhi APK
      uses: actions/upload-artifact@v4
      with:
        name: otomesheni-app-debug
        path: bin/*.apk
